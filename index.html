<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020702">
<title>KRYVON</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; overflow: hidden;
    background: #020702;
  }
  .world {
    position: relative; width: 100%; height: 100%; min-height: 100svh;
    overflow: hidden; isolation: isolate; background: #020702;
  }
  .scene {
    position: absolute; inset: -7%;
    width: 114%; height: 114%;
    object-fit: cover; object-position: center;
    transform: scale(1.04);
    animation: approach 24s cubic-bezier(.35,0,.2,1) infinite alternate;
    will-change: transform;
  }
  .shade {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 43%, transparent 34%, rgba(0,0,0,.18) 70%, rgba(0,0,0,.58) 115%),
      linear-gradient(180deg, rgba(0,0,0,.12), transparent 35%, rgba(0,0,0,.2));
  }
  .warp {
    position: absolute; inset: -35%; pointer-events: none; opacity: .16;
    background: repeating-conic-gradient(from 0deg at 50% 48%,
      transparent 0deg 3.2deg, rgba(60,255,70,.22) 3.25deg 3.38deg,
      transparent 3.45deg 7deg);
    -webkit-mask-image: radial-gradient(ellipse at center, transparent 0 25%, rgba(0,0,0,.55) 48%, #000 76%);
    mask-image: radial-gradient(ellipse at center, transparent 0 25%, rgba(0,0,0,.55) 48%, #000 76%);
    animation: warp 36s linear infinite;
  }
  .glow {
    position: absolute; inset: 0; pointer-events: none; opacity: .22;
    background: radial-gradient(ellipse at 50% 48%, rgba(0,255,40,.18), transparent 52%);
    animation: pulse 5s ease-in-out infinite alternate;
  }
  @keyframes approach {
    from { transform: scale(1.04) translate3d(0,0,0); }
    to { transform: scale(1.23) translate3d(0,-1.2%,0); }
  }
  @keyframes warp { to { transform: rotate(360deg) scale(1.04); } }
  @keyframes pulse { from { opacity: .12; } to { opacity: .3; } }
  @media (max-width: 700px) {
    .scene { object-position: 50% center; }
    @keyframes approach {
      from { transform: scale(1.12); }
      to { transform: scale(1.34) translateY(-1%); }
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .scene, .warp, .glow { animation: none; }
  }
</style>
</head>
