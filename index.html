<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020702">
<title>KRYVON</title>
<style>
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #020702; }
.world {
  position: fixed; inset: 0; overflow: hidden; isolation: isolate;
  background: radial-gradient(ellipse at center, #0b2a0f 0%, #041106 55%, #020702 100%);
}
.scene {
  position: absolute; z-index: 1; inset: 0; display: block;
  width: 100%; height: 100%; object-fit: cover; object-position: center;
  transform: scale(1.04);
  animation: approach 24s cubic-bezier(.35,0,.2,1) infinite alternate;
  will-change: transform;
}
.brand {
  position: absolute; z-index: 0; inset: 0; display: grid; place-items: center;
  color: rgba(120,255,130,.85); font: 700 clamp(32px, 9vw, 96px) system-ui, sans-serif;
  letter-spacing: .3em; text-shadow: 0 0 24px rgba(0,255,60,.5);
}
.shade { position: absolute; z-index: 2; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 43%, transparent 34%, rgba(0,0,0,.18) 70%, rgba(0,0,0,.58) 115%),
              linear-gradient(180deg, rgba(0,0,0,.08), transparent 35%, rgba(0,0,0,.18)); }
.warp { position: absolute; z-index: 3; inset: -35%; pointer-events: none; opacity: .22;
  background: repeating-conic-gradient(from 0deg at 50% 48%, transparent 0deg 3.2deg, rgba(60,255,70,.22) 3.25deg 3.38deg, transparent 3.45deg 7deg);
  -webkit-mask-image: radial-gradient(ellipse at center, transparent 0 25%, rgba(0,0,0,.55) 48%, #000 76%);
  mask-image: radial-gradient(ellipse at center, transparent 0 25%, rgba(0,0,0,.55) 48%, #000 76%);
  animation: warp 36s linear infinite; }
.glow { position: absolute; z-index: 4; inset: 0; pointer-events: none; opacity: .22;
  background: radial-gradient(ellipse at 50% 48%, rgba(0,255,40,.18), transparent 52%);
  animation: pulse 5s ease-in-out infinite alternate; }
@keyframes approach { from { transform: scale(1.04); } to { transform: scale(1.23) translate3d(0,-1.2%,0); } }
@keyframes warp { to { transform: rotate(360deg) scale(1.04); } }
@keyframes pulse { from { opacity: .12; } to { opacity: .3; } }
@media (max-width: 700px) {
  @keyframes approach { from { transform: scale(1.12); } to { transform: scale(1.34) translateY(-1%); } }
}
@media (prefers-reduced-motion: reduce) { .scene, .warp, .glow { animation: none; } }
</style>
</head>
